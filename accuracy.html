<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Osteon · Landmark review</title><style>
:root{color-scheme:dark;font:14px/1.5 system-ui;background:#0e191f;color:#e5eee7}*{box-sizing:border-box}body{margin:0;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);padding:24px max(24px,calc((100vw - 1120px)/2));gap:18px}a{color:#b5e6be}button,input,select{font:inherit;color:inherit;background:#1b3035;border:1px solid #49615d;border-radius:8px;padding:8px 12px;min-height:42px}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.45}button:hover{border-color:#b5e6be}h1{font:38px/1.1 Georgia;margin:8px 0}p{margin:6px 0;color:#b8c9cb}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-size:23px;font-weight:700;text-decoration:none}.brand span{color:#e7aa7e}small,.eyebrow{font-size:11px;color:#b4c8c2}.eyebrow{text-transform:uppercase;letter-spacing:.12em}main{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters input{flex:1;min-width:180px}.cards{min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:9px}article{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 18px;padding:13px 17px;border:1px solid #354e50;background:#16272d;border-radius:12px;align-content:center}article h2{margin:0;font:23px/1.2 Georgia}.status{align-self:start;font-size:11px;border:1px solid #627b6b;padding:4px 8px;border-radius:20px;white-space:nowrap;color:#b5e6be}.status.hold{border-color:#b8805e;color:#e7b48c}.note{grid-column:1/-1;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px}.actions{display:flex;gap:15px;align-items:center}.actions button{min-height:30px;padding:3px 0;border:0;background:transparent;font-size:12px;text-decoration:underline}.actions a{font-size:12px}nav{display:flex;justify-content:space-between;align-items:center;gap:12px}dialog{width:min(940px,95vw);max-height:92dvh;background:#14282d;color:#e4eee8;border:1px solid #5d786a;border-radius:14px;padding:22px}dialog::backdrop{background:#020c10dc}dialog h2{font:30px Georgia;margin:0 0 12px}dialog h3{font-size:13px;color:#b5e6be}dialog img{width:100%;max-height:48vh;object-fit:contain;background:#e6e7e1;border-radius:8px}dialog .close{float:right}dialog p{font-size:13px}dialog footer{margin-top:15px}.empty{padding:20px;border:1px dashed #68847c;border-radius:10px}#message{font-size:11px;color:#aebfbd}@media(max-width:700px){body{height:auto;min-height:100dvh;padding:17px;gap:13px}h1{font-size:31px}.top{font-size:11px}.filters>*{flex:1}.cards{grid-template-rows:none}article{grid-template-columns:1fr;gap:8px;padding:15px}article h2{font-size:23px}.status{justify-self:start;grid-row:2}.actions{flex-wrap:wrap}.note{grid-column:1}#count{display:block}}
.review-tabs{display:flex;gap:8px;margin:14px 0}.review-tabs button{font-size:12px}.review-tabs button[aria-pressed=true]{background:#355347;border-color:#b5e6be}.review-image-frame{height:42vh;min-height:160px;margin:12px 0}.review-image-frame img{width:100%;height:100%;object-fit:contain}.evidence-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}.evidence-nav button{font-size:12px}dialog:has(.review-image-frame){overflow:hidden}@media(max-width:700px){dialog:has(.review-image-frame){overflow:auto}.review-tabs{flex-wrap:wrap}.review-image-frame{height:35vh}}
</style></head><body><header><div class="top"><a class="brand" href="./#atlas">✳ osteon<span>.</span></a><a href="ACCURACY-REVIEW.csv" download>Download all review records ↓</a></div><div class="eyebrow">Source · morphology · display</div><h1>Landmark review.</h1><p id="summary">Loading the review record…</p><p id="message">Review records distinguish supported anatomy, applied corrections, and unresolved geometry. Evidence includes offline inspection; this is not clinical certification.</p></header><main><div class="filters"><input id="search" type="search" aria-label="Search landmark review" placeholder="Search a landmark or bone"><select id="scope" aria-label="Review scope"><option value="textbook">310 textbook features</option><option value="all">All atlas and course entries</option></select><select id="status" aria-label="Review disposition"><option value="all">Every disposition</option><option value="correction-applied">Corrections applied</option><option value="held">Study references / 3D work remaining</option><option value="reviewed">Source / morphology reviewed</option></select></div><div id="cards" class="cards" aria-live="polite"></div><nav aria-label="Review pages"><button id="previous">← Previous</button><span id="count"></span><button id="next">Next →</button></nav></main><dialog id="detail"><button class="close" id="close" aria-label="Close review">✕</button><div id="detail-body"></div></dialog><script type="module">
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,page=0,visible=[];
const names={'reviewed':'Source / morphology reviewed','correction-applied':'Correction applied','source-only':'3D target withheld','reference-only':'Study reference · no spatial score','needs-review':'Review pending'};
function render(){const q=$('#search').value.toLowerCase(),status=$('#status').value;visible=data.items.filter(x=>($('#scope').value==='all'||x.canonicalId)&&(!q||[x.name,x.region,x.description].join(' ').toLowerCase().includes(q))&&(status==='all'||(status==='held'?['source-only','reference-only','needs-review'].includes(x.status):x.status===status)));const pages=Math.max(1,Math.ceil(visible.length/3));page=Math.min(page,pages-1);$('#cards').innerHTML=visible.slice(page*3,page*3+3).map(x=>`<article><h2>${e(x.name)}</h2><span class="status ${/only|pending/.test(x.status)?'hold':''}">${e(names[x.status])}</span><small>${e(x.region)} · OpenStax ${e(x.section)}</small><p class="note">${e(x.currentDisposition||x.description)}</p><div class="actions"><a href="./?feature=${encodeURIComponent(x.id)}#atlas">Open current atlas ↗</a><button type="button" data-review="${e(x.id)}">Review findings & evidence</button></div></article>`).join('')||'<div class="empty">No entries match these filters.</div>';$('#count').textContent=`${visible.length} entries · ${page+1} / ${pages}`;$('#previous').disabled=page===0;$('#next').disabled=page===pages-1;document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>show(b.dataset.review));}
function show(id,tab='findings',imageIndex=0){const x=data.items.find(x=>x.id===id);const image=x.evidence[imageIndex];$('#detail-body').innerHTML=`<div class="eyebrow">${e(names[x.status])}</div><h2>${e(x.name)}</h2><div class="review-tabs"><button id="review-findings" aria-pressed="${tab==='findings'}">Findings & current status</button><button id="review-images" ${x.evidence.length?'':'disabled'} aria-pressed="${tab==='evidence'}">Inspection images · ${x.evidence.length}</button></div>${tab==='findings'?`<p>${e(x.description)}</p><h3>Initial review finding</h3>${x.reviewFindings.map(v=>`<p>${e(v)}</p>`).join('')||'<p>The named anatomy and its source relationship were supported at the reviewed scope.</p>'}<h3>Current disposition</h3><p>${e(x.currentDisposition)}</p><p>Spatial scoring: <strong>${x.spatialScoring?'enabled':'withheld'}</strong>. ${e(x.reviewMethod)}</p>`:`<p>Inspection evidence can show the problem before correction. Compare with the current atlas.</p><div class="review-image-frame"><img src="${e(image)}" alt="Anatomy inspection evidence for ${e(x.name)}"></div><div class="evidence-nav"><button id="image-prev" ${imageIndex?'':'disabled'}>← Previous image</button><span>${imageIndex+1} / ${x.evidence.length}</span><button id="image-next" ${imageIndex<x.evidence.length-1?'':'disabled'}>Next image →</button></div>`}<footer><a href="./?feature=${encodeURIComponent(x.id)}#atlas">Open current atlas ↗</a> · <a href="REVIEW.md" target="_blank">Review method and limits</a></footer>`;$('#review-findings').onclick=()=>show(id);$('#review-images').onclick=()=>show(id,'evidence');if($('#image-prev'))$('#image-prev').onclick=()=>show(id,'evidence',imageIndex-1);if($('#image-next'))$('#image-next').onclick=()=>show(id,'evidence',imageIndex+1);if(!$('#detail').open)$('#detail').showModal();}

$('#previous').onclick=()=>{page--;render()};$('#next').onclick=()=>{page++;render()};for(const id of ['search','status','scope'])$('#'+id).addEventListener(id==='search'?'input':'change',()=>{page=0;render()});$('#close').onclick=()=>$('#detail').close();try{data=await(await fetch('accuracy-review.json')).json();const s=data.summary,c=s.canonicalCounts;$('#summary').textContent=`${s.canonicalFeatures} textbook features · ${s.originalCourseItems} original lab items preserved. ${c['correction-applied']||0} textbook entries updated; ${(c['source-only']||0)+(c['reference-only']||0)} use study references while precise geometry remains unresolved.`;render()}catch(err){$('#summary').textContent='The review record could not load. Use the downloadable CSV or return to the atlas.'}
</script></body></html>
